<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


    <div class="chat-container">


        <!-- =====================================
             CHATBOT TITLE
        ====================================== -->

        <h1>🤖 AI Chatbot</h1>


        <!-- =====================================
             CHAT BOX
        ====================================== -->

        <div id="chat-box">

            <div class="bot-message">
                Hello! 👋 How can I help you?
            </div>

        </div>


        <!-- =====================================
             PDF UPLOAD SECTION
        ====================================== -->

        <div class="upload-area">

            <!-- Hidden file input -->

            <input
                type="file"
                id="pdf-file"
                accept=".pdf"
                style="display: none;"
            >


            <!-- Upload button -->

            <button
                type="button"
                onclick="document.getElementById('pdf-file').click()"
            >
                📎 Upload PDF
            </button>


            <!-- Upload status -->

            <span id="upload-status">
            </span>

        </div>


        <!-- =====================================
             MESSAGE INPUT
        ====================================== -->

        <div class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Type your message..."
                autocomplete="off"
            >


            <button
                type="button"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>


    </div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script
        src="{{ url_for('static', filename='script.js') }}">
    </script>


</body>

</html>
